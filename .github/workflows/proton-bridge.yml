name: Proton Drive Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proton-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      PROTON_SHARE_URL: ${{ secrets.PROTON_SHARE_URL }}

    steps:
      - name: Check bridge configuration
        run: |
          if [ -z "$PROTON_SHARE_URL" ]; then
            echo "PROTON_SHARE_URL is not configured yet."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Proton share URL is configured."

      - name: Checkout bridge repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download from Proton public share
        run: |
          rm -rf bridge-output
          mkdir -p bridge-output
          rm -rf "$HOME/Downloads"
          mkdir -p "$HOME/Downloads"

          cat > bridge-download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const url = process.env.PROTON_SHARE_URL;
          const outputDir = path.resolve('bridge-output');
          const downloadsDir = path.join(process.env.HOME || '/home/runner', 'Downloads');

          if (!url) throw new Error('PROTON_SHARE_URL is missing');

          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const context = await browser.newContext({
            acceptDownloads: true,
            downloadsPath: downloadsDir
          });

          const page = await context.newPage();
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          console.log('Opening Proton public share...');
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await sleep(8000);

          console.log('Page title:', await page.title());
          console.log((await page.locator('body').innerText()).slice(0, 5000));

          const buttons = page.locator('button, a, [role="button"]').filter({ hasText: /download/i });
          const count = await buttons.count();
          console.log('Download controls found:', count);

          if (count === 0) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-no-download.png'), fullPage: true });
            throw new Error('No Download control was found.');
          }

          for (let i = 0; i < count; i++) {
            const info = await buttons.nth(i).evaluate(el => ({
              tag: el.tagName,
              text: el.textContent?.trim(),
              testid: el.getAttribute('data-testid'),
              aria: el.getAttribute('aria-label')
            }));
            console.log('Download control', i, JSON.stringify(info));
          }

          const target = buttons.last();

          console.log('Clicking the file Download control...');
          await target.click({ timeout: 30000 });
          await sleep(5000);

          console.log('Page text after click:');
          console.log((await page.locator('body').innerText()).slice(0, 7000));

          // Wait until the Proton UI reports the transfer as complete.
          let transferComplete = false;
          for (let i = 0; i < 120; i++) {
            const body = await page.locator('body').innerText();
            if (/1 of 1 transfers completed/i.test(body) && /Downloaded/i.test(body)) {
              transferComplete = true;
              console.log('Proton reports: transfer completed and file downloaded.');
              break;
            }
            await sleep(1000);
          }

          if (!transferComplete) {
            console.log('Proton did not report completion within the expected time.');
          }

          // Wait for an actual filesystem object to appear in the configured
          // Playwright download directory. Do not treat page text alone as a file.
          let found = [];

          for (let i = 0; i < 60 && found.length === 0; i++) {
            if (fs.existsSync(downloadsDir)) {
              found = fs.readdirSync(downloadsDir)
                .map(name => path.join(downloadsDir, name))
                .filter(full => fs.existsSync(full) && fs.statSync(full).isFile())
                .filter(full => {
                  const name = path.basename(full);
                  return !name.endsWith('.crdownload') &&
                         !name.endsWith('.tmp') &&
                         !name.endsWith('.part');
                });
            }

            if (found.length) break;
            await sleep(1000);
          }

          console.log('Playwright downloads directory:', downloadsDir);
          console.log('Files found there:', found);

          if (found.length === 0) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-after-click.png'), fullPage: true });
            fs.writeFileSync(
              path.join(outputDir, 'proton-page-after-click.txt'),
              await page.locator('body').innerText()
            );
            throw new Error('Proton reported the transfer completed, but Playwright did not expose the downloaded file.');
          }

          found.sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);
          const source = found[0];
          const destination = path.join(outputDir, path.basename(source));

          fs.copyFileSync(source, destination);

          const size = fs.statSync(destination).size;
          console.log('SUCCESS: collected downloaded file:', destination, size, 'bytes');

          if (size === 0) {
            throw new Error('Downloaded file is empty.');
          }

          await browser.close();
          EOF

          node bridge-download.mjs

      - name: Upload bridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-bridge-output
          path: bridge-output/
          retention-days: 7
          if-no-files-found: warn
