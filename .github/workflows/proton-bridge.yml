name: Proton Drive Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proton-bridge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      PROTON_SHARE_URL: ${{ secrets.PROTON_SHARE_URL }}
      SUPABASE_URL: https://yxblctqvlbgsqtzwuqss.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check bridge configuration
        run: |
          if [ -z "$PROTON_SHARE_URL" ]; then
            echo "PROTON_SHARE_URL is not configured yet."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Proton share URL is configured."

      - name: Checkout bridge repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download from Proton public share folder
        run: |
          rm -rf bridge-output
          mkdir -p bridge-output

          cat > bridge-download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const url = process.env.PROTON_SHARE_URL;
          const outputDir = path.resolve('bridge-output');

          if (!url) throw new Error('PROTON_SHARE_URL is missing');

          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const context = await browser.newContext({ acceptDownloads: true });
          const page = await context.newPage();

          await page.addInitScript(() => {
            const originalCreateObjectURL = URL.createObjectURL.bind(URL);
            const originalRevokeObjectURL = URL.revokeObjectURL.bind(URL);
            const originalOpen = window.open.bind(window);

            window.__protonBridge = {
              blobs: new Map(),
              blobUrls: new Set(),
              events: []
            };

            const rememberBlobUrl = (value, meta = {}) => {
              if (typeof value === 'string' && value.startsWith('blob:')) {
                window.__protonBridge.blobUrls.add(value);
                window.__protonBridge.events.push({
                  type: 'blob-url',
                  url: value,
                  ...meta
                });
              }
            };

            URL.createObjectURL = (object) => {
              const value = originalCreateObjectURL(object);
              try {
                if (object instanceof Blob) {
                  window.__protonBridge.blobs.set(value, object);
                }
              } catch {}
              rememberBlobUrl(value, { source: 'createObjectURL' });
              return value;
            };

            URL.revokeObjectURL = (value) => {
              try {
                if (window.__protonBridge?.blobs?.has(value)) return;
              } catch {}
              return originalRevokeObjectURL(value);
            };

            window.open = function(value, target, features) {
              rememberBlobUrl(value, { source: 'window.open' });
              return originalOpen(value, target, features);
            };

            const originalAnchorClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function() {
              rememberBlobUrl(this.href, {
                source: 'anchor.click',
                download: this.download || ''
              });
              return originalAnchorClick.call(this);
            };

            document.addEventListener('click', (event) => {
              try {
                const eventPath = event.composedPath ? event.composedPath() : [];
                for (const node of eventPath) {
                  if (node instanceof HTMLAnchorElement) {
                    rememberBlobUrl(node.href, {
                      source: 'document.click',
                      download: node.download || ''
                    });
                    break;
                  }
                }
              } catch {}
            }, true);

            const observer = new MutationObserver((mutations) => {
              try {
                for (const mutation of mutations) {
                  for (const node of mutation.addedNodes) {
                    if (!(node instanceof Element)) continue;
                    const anchors = [];
                    if (node instanceof HTMLAnchorElement) anchors.push(node);
                    anchors.push(...node.querySelectorAll?.('a[href],a[download]') || []);
                    for (const anchor of anchors) {
                      rememberBlobUrl(anchor.href, {
                        source: 'mutation',
                        download: anchor.download || ''
                      });
                    }
                  }

                  if (mutation.type === 'attributes' && mutation.target instanceof HTMLAnchorElement) {
                    rememberBlobUrl(mutation.target.href, {
                      source: 'attribute',
                      download: mutation.target.download || ''
                    });
                  }
                }
              } catch {}
            });

            const startObserver = () => {
              if (document.documentElement) {
                observer.observe(document.documentElement, {
                  subtree: true,
                  childList: true,
                  attributes: true,
                  attributeFilter: ['href', 'download']
                });
              }
            };

            startObserver();

            const scanAnchors = () => {
              try {
                for (const anchor of document.querySelectorAll('a[href],a[download]')) {
                  rememberBlobUrl(anchor.href, {
                    source: 'scan',
                    download: anchor.download || ''
                  });
                }
              } catch {}
            };

            scanAnchors();
            setInterval(scanAnchors, 1000);
          });

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          console.log('Opening Proton public share...');
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await sleep(8000);

          const pageTitle = await page.title();
          const pageBody = await page.locator('body').innerText();

          console.log('Page title:', pageTitle);
          console.log(pageBody.slice(0, 5000));

          const titleFileName = pageTitle
            .replace(/\s*[-|]\s*Proton Drive\s*$/i, '')
            .trim();

          console.log('Filename candidate from page title:', titleFileName || '(none)');

          const buttons = page.locator('button, a, [role="button"]').filter({ hasText: /download/i });
          const count = await buttons.count();
          console.log('Download controls found:', count);

          if (count === 0) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-no-download.png'), fullPage: true });
            throw new Error('No Download control was found.');
          }

          for (let i = 0; i < count; i++) {
            const info = await buttons.nth(i).evaluate(el => ({
              tag: el.tagName,
              text: el.textContent?.trim(),
              testid: el.getAttribute('data-testid'),
              aria: el.getAttribute('aria-label')
            }));
            console.log('Download control', i, JSON.stringify(info));
          }

          const isFolderView =
            /(?:^|\n)Uploaded by\s*(?:\n|$)/i.test(pageBody) &&
            /(?:^|\n)Size\s*(?:\n|$)/i.test(pageBody);

          console.log('Detected Proton source:', isFolderView ? 'folder' : 'single file');

          let target;
          if (isFolderView) {
            const trigger = page.locator('[data-testid="dropdown-download-button"]').first();

            if (await trigger.count() === 0) {
              throw new Error('Proton folder Download menu trigger was not found.');
            }

            console.log('Opening Proton folder Download menu...');
            await trigger.click({ timeout: 30000 });
            await sleep(600);

            const candidates = await page.evaluate(() => {
              const visible = (el) => {
                const style = window.getComputedStyle(el);
                const rect = el.getBoundingClientRect();
                return style.visibility !== 'hidden' &&
                  style.display !== 'none' &&
                  rect.width > 0 &&
                  rect.height > 0;
              };

              return [...document.querySelectorAll('button, a, [role="button"], [role="menuitem"]')]
                .map((el, index) => {
                  const rect = el.getBoundingClientRect();
                  const text = (el.textContent || '').trim().replace(/\s+/g, ' ');
                  const role = el.getAttribute('role') || '';
                  const testid = el.getAttribute('data-testid') || '';
                  const inMenu = role === 'menuitem' || !!el.closest('[role="menu"]');
                  const matchesDownload = /download/i.test(text);
                  let score = 0;
                  if (matchesDownload) score += 30;
                  if (inMenu) score += 100;
                  if (rect.top < 350) score += 20;
                  if (testid === 'dropdown-download-button') score -= 200;
                  return { index, text, role, testid, top: Math.round(rect.top), score, visible: visible(el) };
                })
                .filter(item => item.visible && /download/i.test(item.text) && item.testid !== 'dropdown-download-button')
                .sort((a, b) => b.score - a.score);
            });

            console.log('Folder Download menu candidates:', JSON.stringify(candidates.slice(0, 12)));

            if (!candidates.length) {
              throw new Error('No visible Download action appeared after opening the Proton folder menu.');
            }

            const chosen = candidates[0];
            console.log('Clicking folder download action:', JSON.stringify(chosen));
            target = page.locator('button, a, [role="button"], [role="menuitem"]').nth(chosen.index);
          } else {
            target = buttons.last();
          }

          console.log('Clicking Proton Download control...');
          await target.click({ timeout: 30000 });

          let transferComplete = false;
          for (let i = 0; i < 180; i++) {
            const body = await page.locator('body').innerText();

            if (/\b\d+\s+of\s+\d+\s+transfers\s+completed\b/i.test(body) && /Downloaded/i.test(body)) {
              transferComplete = true;
              console.log('Proton reports: transfer(s) completed and file downloaded.');
              break;
            }

            await sleep(1000);
          }

          await sleep(2000);

          if (!transferComplete) {
            await page.screenshot({ path: path.join(outputDir, 'proton-transfer-timeout.png'), fullPage: true });
            throw new Error('Proton did not report a completed download within the expected time.');
          }

          const capture = await page.evaluate(async () => {
            const bridge = window.__protonBridge;
            if (!bridge) return { error: 'Bridge instrumentation is missing.' };

            const candidates = [...bridge.blobUrls];

            for (const anchor of document.querySelectorAll('a[href],a[download]')) {
              const href = anchor.href || '';
              if (href.startsWith('blob:')) {
                candidates.push(href);
                bridge.blobUrls.add(href);
              }
            }

            const unique = [...new Set(candidates)];
            const results = [];

            for (const blobUrl of unique.reverse()) {
              try {
                let blob = bridge.blobs.get(blobUrl);

                if (!blob) {
                  const response = await fetch(blobUrl);
                  if (!response.ok) {
                    results.push({ url: blobUrl, error: 'fetch failed: ' + response.status });
                    continue;
                  }
                  blob = await response.blob();
                }

                if (!blob || blob.size === 0) {
                  results.push({ url: blobUrl, error: 'empty blob' });
                  continue;
                }

                const buffer = await blob.arrayBuffer();
                const bytes = new Uint8Array(buffer);

                let binary = '';
                const chunkSize = 0x8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                  binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
                }

                const event = bridge.events
                  .slice()
                  .reverse()
                  .find(item => item.url === blobUrl);

                return {
                  url: blobUrl,
                  name: event?.download || '',
                  mime: blob.type || 'application/octet-stream',
                  size: bytes.length,
                  base64: btoa(binary),
                  events: bridge.events.slice(-50)
                };
              } catch (error) {
                results.push({
                  url: blobUrl,
                  error: String(error)
                });
              }
            }

            return {
              error: 'No usable blob URL was observed by the browser instrumentation.',
              events: bridge.events.slice(-50),
              results
            };
          });

          console.log('Blob capture summary:', JSON.stringify({
            error: capture?.error,
            name: capture?.name,
            mime: capture?.mime,
            size: capture?.size,
            url: capture?.url,
            eventCount: capture?.events?.length
          }));

          if (!capture || capture.error || !capture.base64) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-capture-failed.png'), fullPage: true });
            fs.writeFileSync(
              path.join(outputDir, 'proton-page-capture-failed.txt'),
              JSON.stringify(capture, null, 2)
            );
            throw new Error(capture?.error || 'No usable Proton blob was captured.');
          }

          const discoveredName = capture.name || titleFileName || 'proton-download.bin';
          const safeName = String(discoveredName)
            .replace(/[<>:"/\\|?*\u0000-\u001F]/g, '_')
            .replace(/\s+/g, ' ')
            .replace(/[. ]+$/, '')
            .trim();

          let finalName = safeName || 'proton-download.bin';
          if (isFolderView && !/\\.zip$/i.test(finalName)) {
            finalName = `${finalName}.zip`;
          }

          const destination = path.join(outputDir, finalName);
          const bytes = Buffer.from(capture.base64, 'base64');

          fs.writeFileSync(destination, bytes);
          fs.writeFileSync(
            path.join(outputDir, '.proton-source-type'),
            isFolderView ? 'folder' : 'file'
          );

          console.log('SUCCESS: captured Proton download');
          console.log('Filename:', finalName);
          console.log('MIME type:', capture.mime);
          console.log('Bytes:', bytes.length);
          console.log('Saved to:', destination);

          if (bytes.length === 0) {
            throw new Error('Captured Proton file is empty.');
          }

          await browser.close();
          EOF

          node bridge-download.mjs

      - name: Extract Proton folder archive when needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          output = Path("bridge-output")
          marker = output / ".proton-source-type"
          source_type = marker.read_text().strip() if marker.exists() else "file"

          if source_type != "folder":
              print("Downloaded source is a single file; skipping folder extraction.")
              raise SystemExit(0)

          archives = [
              p for p in output.iterdir()
              if p.is_file() and p.suffix.lower() == ".zip"
          ]

          if not archives:
              raise SystemExit("Proton folder download was expected to be a ZIP, but no .zip file was captured.")

          if len(archives) > 1:
              raise SystemExit("Multiple folder ZIP archives detected; refusing ambiguous extraction.")

          archive = archives[0]
          extract_root = output / ".folder-extract"
          if extract_root.exists():
              shutil.rmtree(extract_root)
          extract_root.mkdir(parents=True)

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\\\", "/")
                  path = Path(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path refused: {info.filename}")
                  target = extract_root / path
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

          archive.unlink()

          for child in extract_root.iterdir():
              destination = output / child.name
              if destination.exists():
                  if destination.is_dir() and child.is_dir():
                      for nested in child.iterdir():
                          target = destination / nested.name
                          if target.exists():
                              raise SystemExit(f"Extraction collision refused: {target}")
                          shutil.move(str(nested), str(target))
                      child.rmdir()
                  else:
                      raise SystemExit(f"Extraction collision refused: {destination}")
              else:
                  shutil.move(str(child), str(destination))

          shutil.rmtree(extract_root)
          print(f"Extracted Proton folder archive: {archive.name}")
          PY

      - name: Publish to Supabase
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not configured yet; Supabase publish skipped."
            exit 0
          fi
          node bridge-upload-supabase.mjs

      - name: Verify Supabase copy
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not configured; Supabase verification skipped."
            exit 0
          fi
          node bridge-verify-supabase.mjs

      - name: Upload bridge artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: proton-bridge-output
          path: bridge-output/
          retention-days: 7
          if-no-files-found: warn
