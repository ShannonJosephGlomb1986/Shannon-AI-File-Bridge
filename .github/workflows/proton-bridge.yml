name: Proton Drive Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proton-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      PROTON_SHARE_URL: ${{ secrets.PROTON_SHARE_URL }}

    steps:
      - name: Check bridge configuration
        run: |
          if [ -z "$PROTON_SHARE_URL" ]; then
            echo "PROTON_SHARE_URL is not configured yet."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Proton share URL is configured."

      - name: Checkout bridge repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Proton public-share downloader
        run: |
          npm install --no-save pdown

      - name: Download from Proton public share
        run: |
          mkdir -p bridge-output
          echo "Downloading the Proton public share..."
          npx --yes pdown dl "$PROTON_SHARE_URL" -o bridge-output
          echo
          echo "Downloaded files:"
          find bridge-output -maxdepth 2 -type f -printf '%p (%s bytes)\n'

          if ! find bridge-output -maxdepth 2 -type f -print -quit | grep -q .; then
            echo "ERROR: Proton downloader produced no files."
            exit 1
          fi

      - name: Upload bridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-bridge-output
          path: bridge-output/
          retention-days: 7
          if-no-files-found: warn
