name: Proton Drive Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proton-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      PROTON_SHARE_URL: ${{ secrets.PROTON_SHARE_URL }}

    steps:
      - name: Check bridge configuration
        run: |
          if [ -z "$PROTON_SHARE_URL" ]; then
            echo "PROTON_SHARE_URL is not configured yet."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Proton share URL is configured."

      - name: Checkout bridge repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download from Proton public share
        run: |
          rm -rf bridge-output
          mkdir -p bridge-output

          cat > bridge-download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const url = process.env.PROTON_SHARE_URL;
          const outputDir = path.resolve('bridge-output');

          if (!url) throw new Error('PROTON_SHARE_URL is missing');

          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const context = await browser.newContext({ acceptDownloads: true });
          const page = await context.newPage();

          // Proton Drive's web client completes the encrypted download in the
          // browser and can hand the decrypted result to a blob URL rather than
          // the native browser download manager. Capture that blob directly.
          await page.addInitScript(() => {
            const originalCreateObjectURL = URL.createObjectURL.bind(URL);
            const originalRevokeObjectURL = URL.revokeObjectURL.bind(URL);

            window.__protonBridge = {
              blobs: new Map(),
              clicks: []
            };

            URL.createObjectURL = (object) => {
              const value = originalCreateObjectURL(object);
              try {
                if (object instanceof Blob) {
                  window.__protonBridge.blobs.set(value, object);
                }
              } catch {}
              return value;
            };

            // Keep captured blobs alive until Node has copied their bytes.
            URL.revokeObjectURL = (value) => {
              try {
                if (window.__protonBridge?.blobs?.has(value)) return;
              } catch {}
              return originalRevokeObjectURL(value);
            };

            const originalAnchorClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function() {
              try {
                const href = this.href || '';
                if (href.startsWith('blob:') && window.__protonBridge) {
                  window.__protonBridge.clicks.push({
                    href,
                    download: this.download || ''
                  });
                }
              } catch {}
              return originalAnchorClick.call(this);
            };
          });

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          console.log('Opening Proton public share...');
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await sleep(8000);

          console.log('Page title:', await page.title());
          console.log((await page.locator('body').innerText()).slice(0, 5000));

          const buttons = page.locator('button, a, [role="button"]').filter({ hasText: /download/i });
          const count = await buttons.count();
          console.log('Download controls found:', count);

          if (count === 0) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-no-download.png'), fullPage: true });
            throw new Error('No Download control was found.');
          }

          for (let i = 0; i < count; i++) {
            const info = await buttons.nth(i).evaluate(el => ({
              tag: el.tagName,
              text: el.textContent?.trim(),
              testid: el.getAttribute('data-testid'),
              aria: el.getAttribute('aria-label')
            }));
            console.log('Download control', i, JSON.stringify(info));
          }

          const target = buttons.last();

          console.log('Clicking the file Download control...');
          await target.click({ timeout: 30000 });

          // Wait for Proton itself to report that the decrypted transfer finished.
          let transferComplete = false;
          for (let i = 0; i < 180; i++) {
            const body = await page.locator('body').innerText();

            if (/1 of 1 transfers completed/i.test(body) && /Downloaded/i.test(body)) {
              transferComplete = true;
              console.log('Proton reports: transfer completed and file downloaded.');
              break;
            }

            await sleep(1000);
          }

          // Give the download UI a moment to create/click its blob URL.
          await sleep(3000);

          const capture = await page.evaluate(async () => {
            const bridge = window.__protonBridge;
            if (!bridge || !bridge.clicks?.length) return null;

            // Prefer the most recent blob click.
            const click = bridge.clicks[bridge.clicks.length - 1];
            const blob = bridge.blobs.get(click.href);

            if (!blob) {
              return { error: 'A blob URL was clicked, but its Blob object was not captured.' };
            }

            const buffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(buffer);

            // Base64 lets the browser hand arbitrary binary bytes back to Node.
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
              binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }

            return {
              name: click.download || 'proton-download',
              mime: blob.type || 'application/octet-stream',
              size: bytes.length,
              base64: btoa(binary)
            };
          });

          if (!capture || capture.error) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-capture-failed.png'), fullPage: true });
            fs.writeFileSync(
              path.join(outputDir, 'proton-page-capture-failed.txt'),
              JSON.stringify(capture, null, 2)
            );
            throw new Error(capture?.error || 'No blob download was captured from Proton.');
          }

          const safeName = String(capture.name).replace(/[^a-zA-Z0-9._-]/g, '_');
          const destination = path.join(outputDir, safeName);
          const bytes = Buffer.from(capture.base64, 'base64');

          fs.writeFileSync(destination, bytes);

          console.log('SUCCESS: captured Proton decrypted blob');
          console.log('Filename:', safeName);
          console.log('MIME type:', capture.mime);
          console.log('Bytes:', bytes.length);
          console.log('Saved to:', destination);

          if (bytes.length === 0) {
            throw new Error('Captured Proton file is empty.');
          }

          await browser.close();
          EOF

          node bridge-download.mjs

      - name: Upload bridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-bridge-output
          path: bridge-output/
          retention-days: 7
          if-no-files-found: warn
