name: Proton Drive Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proton-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      PROTON_SHARE_URL: ${{ secrets.PROTON_SHARE_URL }}

    steps:
      - name: Check bridge configuration
        run: |
          if [ -z "$PROTON_SHARE_URL" ]; then
            echo "PROTON_SHARE_URL is not configured yet."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Proton share URL is configured."

      - name: Checkout bridge repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download from Proton public share
        run: |
          rm -rf bridge-output
          mkdir -p bridge-output
          rm -rf "$HOME/Downloads"
          mkdir -p "$HOME/Downloads"

          cat > bridge-download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const url = process.env.PROTON_SHARE_URL;
          const outputDir = path.resolve('bridge-output');
          const downloadsDir = path.join(process.env.HOME || '/home/runner', 'Downloads');

          if (!url) throw new Error('PROTON_SHARE_URL is missing');

          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const context = await browser.newContext({
            acceptDownloads: true,
            downloadsPath: downloadsDir
          });

          const page = await context.newPage();
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          console.log('Opening Proton public share...');
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await sleep(8000);

          console.log('Page title:', await page.title());
          console.log((await page.locator('body').innerText()).slice(0, 5000));

          const buttons = page.locator('button, a, [role="button"]').filter({ hasText: /download/i });
          const count = await buttons.count();
          console.log('Download controls found:', count);

          if (count === 0) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-no-download.png'), fullPage: true });
            throw new Error('No Download control was found.');
          }

          for (let i = 0; i < count; i++) {
            const info = await buttons.nth(i).evaluate(el => ({
              tag: el.tagName,
              text: el.textContent?.trim(),
              testid: el.getAttribute('data-testid'),
              aria: el.getAttribute('aria-label')
            }));
            console.log('Download control', i, JSON.stringify(info));
          }

          // The second/current file Download control is the actionable one.
          const target = buttons.last();

          console.log('Clicking the file Download control...');
          await target.click({ timeout: 30000 });
          await sleep(5000);

          console.log('Page text after click:');
          console.log((await page.locator('body').innerText()).slice(0, 7000));

          // Proton reports transfer completion in its own UI. The browser may save
          // the resulting file through Chrome's download manager rather than emit
          // a Playwright download event, so monitor both the configured downloads
          // directory and common browser download locations.
          const candidates = [
            downloadsDir,
            outputDir,
            path.join(process.env.HOME || '/home/runner', 'Downloads')
          ];

          let found = [];

          for (let i = 0; i < 90 && found.length === 0; i++) {
            for (const dir of candidates) {
              if (!fs.existsSync(dir)) continue;

              for (const name of fs.readdirSync(dir)) {
                const full = path.join(dir, name);
                if (!fs.existsSync(full) || !fs.statSync(full).isFile()) continue;

                // Ignore diagnostics and partial browser files.
                if (
                  name.endsWith('.png') ||
                  name.endsWith('.txt') ||
                  name.endsWith('.crdownload') ||
                  name.endsWith('.tmp') ||
                  name.endsWith('.part')
                ) continue;

                found.push(full);
              }
            }

            if (found.length) break;
            await sleep(1000);
          }

          // As a final fallback, scan the runner's normal Downloads directory.
          if (found.length === 0 && fs.existsSync(downloadsDir)) {
            found = fs.readdirSync(downloadsDir)
              .map(name => path.join(downloadsDir, name))
              .filter(full => fs.existsSync(full) && fs.statSync(full).isFile())
              .filter(full => !full.endsWith('.crdownload') && !full.endsWith('.tmp') && !full.endsWith('.part'));
          }

          console.log('Download locations checked:', candidates.join(', '));
          console.log('Found files:', found);

          if (found.length === 0) {
            await page.screenshot({ path: path.join(outputDir, 'proton-page-after-click.png'), fullPage: true });
            fs.writeFileSync(path.join(outputDir, 'proton-page-after-click.txt'), await page.locator('body').innerText());

            console.log('Home directory recent files:');
            const { execSync } = await import('node:child_process');
            try {
              console.log(execSync("find "$HOME" -type f -mmin -10 -not -path '*/.cache/*' | head -100").toString());
            } catch {}
            throw new Error('Proton reported the transfer as downloaded, but no local file could be found.');
          }

          // Copy the newest candidate into the artifact directory.
          found.sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);
          const source = found[0];
          const destination = path.join(outputDir, path.basename(source));

          if (source !== destination) {
            fs.copyFileSync(source, destination);
          }

          console.log('SUCCESS: collected downloaded file:', destination, fs.statSync(destination).size, 'bytes');

          await browser.close();
          EOF

          node bridge-download.mjs

      - name: Upload bridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-bridge-output
          path: bridge-output/
          retention-days: 7
          if-no-files-found: warn
